<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juwon Sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e1e3e8; margin: 0; padding: 0; display: flex; height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 320px; background: #161822; padding: 24px; border-right: 1px solid #282b3a; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    .sidebar h1 { font-size: 1.3rem; margin: 0; color: #fff; }
    .sidebar .subtitle { font-size: 0.85rem; color: #8b8f9a; margin-top: 4px; }
    
    .card { background: #1f2231; border-radius: 10px; padding: 16px; border: 1px solid #2d3146; }
    .card h3 { margin: 0 0 8px 0; font-size: 1.05rem; color: #7c8cff; }
    .card p { margin: 0; font-size: 0.85rem; color: #a9adc1; line-height: 1.4; }
    
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 0.75rem; font-weight: 700; color: #8b8f9a; letter-spacing: 0.5px; text-transform: uppercase; }
    .field-group input, .field-group select { background: #0f1117; border: 1px solid #2d3146; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    .field-group a { font-size: 0.75rem; color: #7c8cff; text-decoration: none; margin-top: 2px; }

    .btn-primary { background: #6366f1; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #2a2d3d; color: #e1e3e8; border: 1px solid #3d4257; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-secondary:hover { background: #35394e; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #0b0c10; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid #1f2231; background: #12141d; }
    .chat-header h2 { margin: 0; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
    .chat-header p { margin: 2px 0 0 16px; font-size: 0.8rem; color: #8b8f9a; }

    .messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .system-banner { background: #161c2e; border: 1px solid #253354; color: #93c5fd; padding: 16px; border-radius: 10px; text-align: center; font-size: 0.9rem; max-width: 700px; margin: 0 auto 10px auto; }

    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; position: relative; }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.bot { align-self: flex-start; }

    .msg { padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; position: relative; }
    .user .msg { background: #6366f1; color: white; border-bottom-right-radius: 2px; }
    .bot .msg { background: #1f2231; color: #e1e3e8; border: 1px solid #2d3146; border-bottom-left-radius: 2px; }

    .translation-box { margin-top: 8px; padding: 8px 12px; background: #161822; border-left: 3px solid #7c8cff; border-radius: 4px; font-size: 0.85rem; color: #a9adc1; display: none; }

    /* Action Controls */
    .msg-actions { display: flex; gap: 8px; margin-top: 6px; opacity: 0.85; }
    .user .msg-actions { justify-content: flex-end; }

    .action-btn { background: #2a2d3d; border: 1px solid #3d4257; color: #a9adc1; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .action-btn:hover { background: #3d4257; color: #fff; }

    .input-bar { padding: 20px 24px; background: #12141d; border-top: 1px solid #1f2231; display: flex; gap: 12px; }
    .input-bar input { flex: 1; background: #0f1117; border: 1px solid #2d3146; color: #fff; padding: 14px 16px; border-radius: 8px; font-size: 0.95rem; }
    .input-bar button { background: #6366f1; color: white; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <h1>Juwon Sandbox</h1>
      <div class="subtitle">Inspired by @mrpockets</div>
    </div>

    <div class="card">
      <h3>Juwon (26)</h3>
      <p>Wearing a cap, mask, and borrowed jacket. Deeply bored of fame. Thrilled you treat him like a nobody. Speaks in Korean speech with English narration.</p>
    </div>

    <div class="field-group">
      <label>Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your API key here" onchange="saveSettings()" />
      <a href="https://aistudio.google.com/" target="_blank">Get one free at Google AI Studio</a>
    </div>

    <div class="field-group">
      <label>Korean Level</label>
      <select id="levelSelect" onchange="saveSettings()">
        <option value="Beginner">Beginner (Simple & Clear)</option>
        <option value="Intermediate">Intermediate (Conversational)</option>
        <option value="Advanced">Advanced (Native Fluency)</option>
      </select>
    </div>

    <button class="btn-primary" onclick="applySettings()">Save & Apply Settings</button>
    <button class="btn-secondary" onclick="resetConversation()">Reset Entire Chat</button>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <h2><span class="status-dot"></span> Juwon</h2>
      <p>In disguise (Cap & Mask)</p>
    </div>

    <div class="messages" id="messages">
      <div class="system-banner" id="systemBanner"></div>
    </div>

    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Type your response to Juwon..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
  let history = [];

  // CUSTOM STARTER MESSAGE (Written in Wonderglot format)
  const defaultStarterMessage = `*(Juwon pulls down his cap and adjusts his KN95 face mask, looking at you nervously from a few feet away. He takes a quiet breath, realizing you really don't recognize him.)*\n\n"혹시... 여기 잠깐 앉아도 될까요?"\n\n*(Translation: "By any chance... may I sit here for a second?")*`;

  window.onload = () => {
    const key = localStorage.getItem('juwon_key');
    const level = localStorage.getItem('juwon_level');
    const savedHistory = localStorage.getItem('juwon_history');

    if (key) document.getElementById('apiKey').value = key;
    if (level) document.getElementById('levelSelect').value = level;

    updateBanner();

    if (savedHistory) {
      history = JSON.parse(savedHistory);
      renderHistory();
    } else {
      history.push({ role: 'model', parts: [{ text: defaultStarterMessage }] });
      saveAndRender();
    }
  };

  function updateBanner() {
    const level = document.getElementById('levelSelect').value;
    document.getElementById('systemBanner').innerHTML = `<strong>System:</strong> Juwon sandbox active. Korean level set to <strong>${level}</strong>. Speech is in Korean with English actions and hidden translations.`;
  }

  function saveSettings() {
    localStorage.setItem('juwon_key', document.getElementById('apiKey').value.trim());
    localStorage.setItem('juwon_level', document.getElementById('levelSelect').value);
    updateBanner();
  }

  function applySettings() {
    saveSettings();
    alert("Settings applied!");
  }

  function getSystemPrompt() {
    const level = document.getElementById('levelSelect').value;

    return `You are roleplaying as Juwon in a language-learning interactive setup similar to Wonderglot.
Character profile:
- Age: 26. Famous celebrity/idol in heavy disguise (cap, mask, borrowed jacket).
- Deeply bored of fame, thrilled that the user does not recognize him. Will NEVER reveal his last name.

STRICT FORMATTING RULES:
1. ALL actions, descriptions, narration, and user interactions must be written in ENGLISH enclosed in parentheses or asterisks.
2. ALL direct spoken dialogue by Juwon MUST be written strictly in KOREAN inside quotation marks.
3. Match the Korean speech to a ${level} speaker skill level:
   - Beginner: Use simple sentence structures, common everyday Korean vocabulary, and honorifics (존댓말).
   - Intermediate: Natural conversational speed and typical modern phrasing.
   - Advanced: Complex idiomatic Korean, slangs, or natural nuanced speech.
4. AT THE VERY END of every response, provide an English translation block formatted EXACTLY like this:
   *(Translation: "Put the exact English translation of the Korean speech here.")*`;
  }

  async function sendMessage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const inputField = document.getElementById('userInput');
    const userText = inputField.value.trim();

    if (!apiKey) {
      alert("Please enter your Gemini API key in the sidebar!");
      return;
    }
    if (!userText) return;

    inputField.value = '';
    history.push({ role: 'user', parts: [{ text: userText }] });
    saveAndRender();

    await generateResponse();
  }

  async function generateResponse() {
    const apiKey = document.getElementById('apiKey').value.trim();

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: getSystemPrompt() }] },
          contents: history
        })
      });

      const data = await response.json();
      if (data.error) {
        alert(`API Error: ${data.error.message}`);
        return;
      }

      const botText = data.candidates[0].content.parts[0].text;
      history.push({ role: 'model', parts: [{ text: botText }] });
      saveAndRender();

    } catch (err) {
      alert("Error communicating with Gemini API.");
    }
  }

  function playKoreanSpeech(text) {
    // Extracts text inside quotation marks (Korean dialogue)
    const koreanMatch = text.match(/"([^"]+)"/);
    const speechText = koreanMatch ? koreanMatch[1] : text;

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Text-to-speech is not supported on this browser.");
    }
  }

  function toggleTranslation(index) {
    const box = document.getElementById(`trans-${index}`);
    if (box) {
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }
  }

  async function retryLastResponse() {
    if (history.length === 0) return;
    if (history[history.length - 1].role === 'model') {
      history.pop();
    }
    saveAndRender();
    await generateResponse();
  }

  function deleteMessage(index) {
    history.splice(index, 1);
    saveAndRender();
  }

  function saveAndRender() {
    localStorage.setItem('juwon_history', JSON.stringify(history));
    renderHistory();
  }

  function parseTextAndTranslation(fullText) {
    const transRegex = /\*\(Translation:\s*"([^"]+)"\)\*/i;
    const match = fullText.match(transRegex);

    if (match) {
      const cleanText = fullText.replace(transRegex, '').trim();
      const translation = match[1];
      return { cleanText, translation };
    }
    return { cleanText: fullText, translation: null };
  }

  function renderHistory() {
    const container = document.getElementById('messages');
    container.innerHTML = '';
    
    const banner = document.createElement('div');
    banner.className = 'system-banner';
    banner.id = 'systemBanner';
    container.appendChild(banner);
    updateBanner();

    history.forEach((item, index) => {
      const isUser = item.role === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${isUser ? 'user' : 'bot'}`;

      const { cleanText, translation } = parseTextAndTranslation(item.parts[0].text);

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';
      msgDiv.textContent = cleanText;

      // Translation box
      if (!isUser && translation) {
        const transDiv = document.createElement('div');
        transDiv.className = 'translation-box';
        transDiv.id = `trans-${index}`;
        transDiv.textContent = `Translation: "${translation}"`;
        msgDiv.appendChild(transDiv);
      }

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';

      if (!isUser) {
        // Hear Pronunciation Button
        const audioBtn = document.createElement('button');
        audioBtn.className = 'action-btn';
        audioBtn.innerHTML = '🔊 Hear';
        audioBtn.onclick = () => playKoreanSpeech(cleanText);
        actionsDiv.appendChild(audioBtn);

        // Translate Button
        if (translation) {
          const transBtn = document.createElement('button');
          transBtn.className = 'action-btn';
          transBtn.innerHTML = '🌐 Translate';
          transBtn.onclick = () => toggleTranslation(index);
          actionsDiv.appendChild(transBtn);
        }
      }

      // Delete Button
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'action-btn';
      deleteBtn.innerHTML = '✕ Delete';
      deleteBtn.onclick = () => deleteMessage(index);
      actionsDiv.appendChild(deleteBtn);

      // Retry Button (only on last bot message)
      if (!isUser && index === history.length - 1) {
        const retryBtn = document.createElement('button');
        retryBtn.className = 'action-btn';
        retryBtn.innerHTML = '🔄 Retry';
        retryBtn.onclick = () => retryLastResponse();
        actionsDiv.appendChild(retryBtn);
      }

      wrapper.appendChild(msgDiv);
      wrapper.appendChild(actionsDiv);
      container.appendChild(wrapper);
    });

    container.scrollTop = container.scrollHeight;
  }

  function resetConversation() {
    if (confirm("Reset conversation history back to starting prompt?")) {
      localStorage.removeItem('juwon_history');
      history = [{ role: 'model', parts: [{ text: defaultStarterMessage }] }];
      saveAndRender();
    }
  }
</script>
</body>
</html>
