<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with Juwon</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; }
    .header { padding: 15px 20px; border-bottom: 1px solid #eee; background: #fff; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { margin: 0; font-size: 1.2rem; color: #333; }
    .header p { margin: 3px 0 0; font-size: 0.85rem; color: #666; }
    .clear-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .api-section { padding: 10px 20px; background: #fff8e1; border-bottom: 1px solid #ffe082; display: flex; gap: 10px; align-items: center; }
    .api-section input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 0.95rem; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #e9ecef; color: #212529; border-bottom-left-radius: 2px; }
    .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
    .input-area textarea { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 10px; resize: none; height: 40px; font-family: inherit; }
    .input-area button { background: #007bff; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <div>
      <h2>Juwon</h2>
      <p>26 • Professionally adored, desperately bored.</p>
    </div>
    <button class="clear-btn" onclick="resetChat()">Reset Chat</button>
  </div>

  <div class="api-section">
    <input type="password" id="apiKey" placeholder="Paste your Gemini API Key here" onchange="saveKey()" />
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea id="userInput" placeholder="Type a message..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // CHANGE JUWON'S FIRST MESSAGE HERE IF YOU WANT
  const starterMessage = `*(Juwon adjusts his oversized mask, lowering his cap slightly as he looks around. Finding a quiet corner, he looks up at you with tired but curious eyes.)*\n\nHey... do you mind if I sit here for a second?`;

  const systemInstruction = `You are playing the role of Juwon. 
Character description:
- Age: 26 years old.
- Professionally adored celebrity/idol, but desperately bored of the fame.
- Currently wearing a cap, a face mask, and someone else's jacket to stay low-key.
- He will NOT tell the user his last name.
- He finds it fascinating and refreshing that the user does not recognize him.
- Stay strictly in character as Juwon. Include actions/gestures in parentheses when appropriate. Keep responses natural, conversational, and aligned with this personality.

User's role: The one person who doesn't recognize him.`;

  let history = [];

  // Load key & history on startup
  window.onload = () => {
    const savedKey = localStorage.getItem('juwon_api_key');
    if (savedKey) document.getElementById('apiKey').value = savedKey;

    const savedHistory = localStorage.getItem('juwon_chat_history');
    if (savedHistory) {
      history = JSON.parse(savedHistory);
      renderHistory();
    } else {
      // Set initial message
      appendMessage(starterMessage, 'bot');
    }
  };

  function saveKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('juwon_api_key', key);
  }

  async function sendMessage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const inputField = document.getElementById('userInput');
    const userText = inputField.value.trim();

    if (!apiKey) {
      alert("Please paste your Google Gemini API key!");
      return;
    }
    if (!userText) return;

    saveKey();
    appendMessage(userText, 'user');
    inputField.value = '';

    history.push({ role: 'user', parts: [{ text: userText }] });
    saveHistory();

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemInstruction }] },
          contents: history
        })
      });

      const data = await response.json();
      if (data.error) {
        appendMessage(`Error: ${data.error.message}`, 'bot');
        return;
      }

      const botText = data.candidates[0].content.parts[0].text;
      appendMessage(botText, 'bot');
      history.push({ role: 'model', parts: [{ text: botText }] });
      saveHistory();

    } catch (err) {
      appendMessage("Error communicating with Gemini API.", 'bot');
    }
  }

  function appendMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('msg', sender);
    msgDiv.textContent = text;
    const container = document.getElementById('messages');
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
  }

  function renderHistory() {
    const container = document.getElementById('messages');
    container.innerHTML = '';
    appendMessage(starterMessage, 'bot');
    history.forEach(item => {
      const sender = item.role === 'user' ? 'user' : 'bot';
      appendMessage(item.parts[0].text, sender);
    });
  }

  function saveHistory() {
    localStorage.setItem('juwon_chat_history', JSON.stringify(history));
  }

  function resetChat() {
    if (confirm("Are you sure you want to clear your chat history with Juwon?")) {
      localStorage.removeItem('juwon_chat_history');
      history = [];
      renderHistory();
    }
  }
</script>

</body>
</html>
